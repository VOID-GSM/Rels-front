name: CD
on:
  push:
    branches: [feat/dockerfile]
jobs:
  test:
    name: Validate Before Deploy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build test
        run: npm run build

deploy:
  name: Deploy to Server
  needs: test
  runs-on: ubuntu-latest

  steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1
      with: 
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ${{ secrets.FRONT_DEPLOY_PATH }}
          git pull origin feat/dockerfile
          docker compose up --build -d
          docker image prune -failure
    - name: Notify Discord (failure)
      if: failure()
      uses: sarisia/actions-status-discord@v1
      with: 
        webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
        status: failure
        title: CD 배포 실패
        description: "브랜치: '${{ github.ref_name }}' | 배포 중 에러 발생!! "
        color: 0xED4245